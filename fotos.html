<style>
:root{--burgundy:#4C9E9A;--burgundy-deep:#267673;--gold:#6AB7B1;--gold-deep:#3C8885;--gold-pale:#E4F7F4;--text:#244947;--text-soft:#547674;--border:#C8E5E2;--ease-luxe:cubic-bezier(.22,.61,.36,1);--font-script:Great Vibes,cursive;--font-serif:Cormorant Garamond,serif;--font-label:Montserrat,sans-serif;}
*{box-sizing:border-box;margin:0;padding:0;}
body{min-height:100dvh;font-family:var(--font-serif);color:var(--text);background:radial-gradient(ellipse at 18% 4%,rgba(255,255,255,.96),transparent 35%),radial-gradient(ellipse at 92% 18%,rgba(171,225,220,.52),transparent 34%),linear-gradient(160deg,#f6fcfb,#e3f4f1);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:3rem 16px;}
.monogram{font-family:var(--font-script);font-size:3rem;color:var(--burgundy);text-align:center;line-height:1;}
.date{font-family:var(--font-label);font-size:.6rem;letter-spacing:.4em;color:var(--gold-deep);text-align:center;margin:.6rem 0 2rem;}
.section-label{font-family:var(--font-label);font-weight:500;font-size:.62rem;letter-spacing:.5em;text-transform:uppercase;color:var(--gold);text-align:center;display:block;margin-bottom:.6rem;}
.section-title{font-family:var(--font-script);font-weight:400;font-size:clamp(2.2rem,9vw,3rem);text-align:center;color:var(--burgundy);margin-bottom:1.8rem;line-height:1.2;}
.rsvp-text{font-style:italic;font-size:1.08rem;color:var(--text-soft);margin-bottom:1.6rem;line-height:1.75;}
.rsvp-text strong{display:block;font-style:normal;font-weight:600;font-size:clamp(1.45rem,5vw,1.8rem);color:var(--burgundy);margin-bottom:.6rem;line-height:1.15;}
.photo-card{width:100%;}
.back{margin-top:2rem;font-family:var(--font-label);font-size:.62rem;letter-spacing:.25em;text-transform:uppercase;color:var(--text-soft);text-decoration:none;}
.back:hover{color:var(--burgundy);}
.toast{position:fixed;left:50%;bottom:2rem;transform:translate(-50%,20px);background:var(--burgundy-deep);color:#fff;font-family:var(--font-label);font-size:.8rem;padding:.9rem 1.6rem;border-radius:30px;opacity:0;visibility:hidden;transition:all .35s;}
.toast.show{opacity:1;visibility:visible;transform:translate(-50%,0);}
.photo-card{max-width:460px;margin:0 auto;text-align:center;padding:3rem 1.8rem;background:linear-gradient(140deg,rgba(255,255,255,.92),rgba(238,248,235,.8));border:1px solid rgba(126,173,131,.30);border-radius:3px;box-shadow:0 18px 48px rgba(53,100,72,.10);}
.photo-name{display:block;width:100%;max-width:300px;margin:0 auto 1.1rem;padding:.8rem 1rem;font-family:var(--font-serif);font-size:1.05rem;color:var(--text);background:rgba(255,255,255,.85);border:1px solid var(--border);border-radius:30px;text-align:center;outline:none;transition:border-color .3s;}
.photo-name:focus{border-color:var(--gold-deep);}
.photo-input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;}
.btn-photo{display:inline-flex;align-items:center;gap:.6rem;font-family:var(--font-label);font-size:.68rem;letter-spacing:.25em;text-transform:uppercase;color:#f7fff5;background:var(--burgundy);border:1px solid var(--gold-deep);padding:1rem 2rem;border-radius:32px;cursor:pointer;transition:transform .7s var(--ease-luxe),background .7s var(--ease-luxe),box-shadow .7s var(--ease-luxe);}
.btn-photo:hover,.btn-photo:focus-visible{transform:translateY(-4px);background:var(--burgundy-deep);box-shadow:0 12px 26px rgba(38,118,115,.25);}
.btn-photo[aria-disabled="true"]{opacity:.55;pointer-events:none;}
.photo-progress{margin:1.4rem auto 0;max-width:300px;display:none;}
.photo-progress.show{display:block;}
.photo-bar{height:6px;border-radius:6px;background:rgba(126,173,131,.2);overflow:hidden;}
.photo-bar span{display:block;height:100%;width:0;background:var(--burgundy);transition:width .3s;}
.photo-status{margin-top:.7rem;font-family:var(--font-serif);font-style:italic;color:var(--text-soft);font-size:.98rem;}
.photo-thumbs{display:flex;flex-wrap:wrap;justify-content:center;gap:.45rem;margin-top:1.2rem;}
.photo-thumbs img{width:58px;height:58px;object-fit:cover;border-radius:6px;border:1px solid var(--border);}
</style>

<body>
<p class="monogram">F &amp; F</p>
<p class="date">21 . 11 . 2026</p>
<span class="section-label">Recuerdos</span>
<h1 class="section-title">Comparte tus fotos</h1>
<div class="photo-card">
<p class="rsvp-text"><strong>Captura el momento con nosotros</strong>Sube las fotos que tomes durante la celebración y se guardarán en nuestro álbum.</p>
<input class="photo-name" id="photoName" type="text" maxlength="40" placeholder="Tu nombre (opcional)" autocomplete="name" />
<input class="photo-input" id="photoInput" type="file" accept="image/*" multiple />
<label class="btn-photo" for="photoInput" id="photoBtn" role="button" tabindex="0"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 8h3l2-3h6l2 3h3a1 1 0 011 1v10a1 1 0 01-1 1H4a1 1 0 01-1-1V9a1 1 0 011-1z"/><circle cx="12" cy="13.5" r="3.5"/></svg>Subir fotos</label>
<div class="photo-progress" id="photoProgress"><div class="photo-bar"><span id="photoBar"></span></div><p class="photo-status" id="photoStatus"></p></div>
<div class="photo-thumbs" id="photoThumbs"></div>
</div>

<a class="back" href="./">Ver la invitación</a>
<div class="toast" id="toast"></div>
<script>
function showToast(msg){var t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");setTimeout(function(){t.classList.remove("show");},3000);}
/* ===== FOTOS DE INVITADOS (sube a Google Drive vía Apps Script) ===== */
(function(){
var UPLOAD_URL="https://script.google.com/macros/s/AKfycbxfoWWUxl3Afo--LZleXMEcd3iFxwuEHMNj2Z4c90kVYYm_cIPbA8VNgI-pYG7OlAGh/exec"; // termina en /exec
var MAX_SIDE=2400, QUALITY=0.85;
var input=document.getElementById("photoInput");
if(!input)return;
var btn=document.getElementById("photoBtn"),nameEl=document.getElementById("photoName");
var prog=document.getElementById("photoProgress"),bar=document.getElementById("photoBar");
var status=document.getElementById("photoStatus"),thumbs=document.getElementById("photoThumbs");
try{nameEl.value=localStorage.getItem("ff-guest-name")||"";}catch(e){}
btn.addEventListener("keydown",function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();input.click();}});

function compress(file){
return new Promise(function(resolve){
var url=URL.createObjectURL(file),img=new Image();
img.onload=function(){
var w=img.naturalWidth,h=img.naturalHeight,r=Math.min(1,MAX_SIDE/Math.max(w,h));
var c=document.createElement("canvas");c.width=Math.round(w*r);c.height=Math.round(h*r);
c.getContext("2d").drawImage(img,0,0,c.width,c.height);
URL.revokeObjectURL(url);
resolve({data:c.toDataURL("image/jpeg",QUALITY).split(",")[1],mime:"image/jpeg",name:file.name.replace(/\.[^.]+$/,"")+".jpg",thumb:c});
};
img.onerror=function(){ // formato no decodificable (p.ej. HEIC en algunos navegadores): se envía tal cual
URL.revokeObjectURL(url);
var fr=new FileReader();
fr.onload=function(){resolve({data:fr.result.split(",")[1],mime:file.type||"image/heic",name:file.name,thumb:null});};
fr.readAsDataURL(file);
};
img.src=url;
});
}

function send(p,guest){
return fetch(UPLOAD_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({file:p.data,mimeType:p.mime,filename:p.name,name:guest})})
.then(function(r){return r.json();})
.then(function(j){if(!j.ok)throw new Error(j.error||"Error");});
}

input.addEventListener("change",async function(){
var files=Array.prototype.slice.call(input.files||[]);
if(!files.length)return;
if(UPLOAD_URL.indexOf("http")!==0){showToast("La subida de fotos aún no está configurada");input.value="";return;}
var guest=nameEl.value.trim();
try{localStorage.setItem("ff-guest-name",guest);}catch(e){}
btn.setAttribute("aria-disabled","true");prog.classList.add("show");
var ok=0,fail=0;
for(var i=0;i<files.length;i++){
status.textContent="Subiendo "+(i+1)+" de "+files.length+"…";
bar.style.width=(i/files.length*100)+"%";
try{
var p=await compress(files[i]);
await send(p,guest);ok++;
if(p.thumb){var t=new Image();t.src=p.thumb.toDataURL("image/jpeg",.6);t.alt="Foto subida";thumbs.appendChild(t);}
}catch(e){fail++;}
}
bar.style.width="100%";
status.textContent=fail?("Se subieron "+ok+" de "+files.length+". Intenta de nuevo con las que faltaron."):("¡Gracias! "+ok+(ok===1?" foto subida":" fotos subidas")+" ✨");
btn.removeAttribute("aria-disabled");input.value="";
});
})();
</script>
</body>
